<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-label="Decision loss vs. communication">
<title>Decision loss vs. communication</title>
<style>
svg { --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #8a8984;
  --grid: #e4e3df; --accent: #2a78d6; --zone: #2a78d6; --other: #6f6e69; }
@media (prefers-color-scheme: dark) {
  svg { --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #8f8e86;
    --grid: #33332f; --accent: #3987e5; --zone: #3987e5; --other: #a3a299; }
}
.bg { fill: var(--surface); }
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.t { font-size: 15px; font-weight: 600; }
.s { font-size: 12px; fill: var(--ink2); }
.l { font-size: 12.5px; }
.v { font-size: 11.5px; fill: var(--ink2); font-variant-numeric: tabular-nums; }
.ax { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.grid { stroke: var(--grid); stroke-width: 1; }
.zero { stroke: var(--muted); stroke-width: 1; }
.thr { stroke: var(--ink2); stroke-width: 1.5; stroke-dasharray: 5 4; }
.zone { fill: var(--zone); opacity: 0.10; }
.ci { stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; }
.pt { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.ci2 { stroke: var(--other); stroke-width: 2; stroke-linecap: round; }
.pt2 { fill: var(--other); stroke: var(--surface); stroke-width: 2; }
</style>
<rect class="bg" width="760" height="430" rx="8"/>
<text class="t" x="20" y="28">Decision loss vs. communication</text>
<text class="s" x="20" y="48">Mean decision loss (lower is better, 95 % CI) against bytes sent per episode, log scale. In-distribution test, 80 buildings.</text>
<line class="grid" x1="80" y1="350.0" x2="720" y2="350.0"/>
<text class="ax" x="72" y="354.0" text-anchor="end">0.26</text>
<line class="grid" x1="80" y1="310.0" x2="720" y2="310.0"/>
<text class="ax" x="72" y="314.0" text-anchor="end">0.28</text>
<line class="grid" x1="80" y1="270.0" x2="720" y2="270.0"/>
<text class="ax" x="72" y="274.0" text-anchor="end">0.30</text>
<line class="grid" x1="80" y1="230.0" x2="720" y2="230.0"/>
<text class="ax" x="72" y="234.0" text-anchor="end">0.32</text>
<line class="grid" x1="80" y1="190.0" x2="720" y2="190.0"/>
<text class="ax" x="72" y="194.0" text-anchor="end">0.34</text>
<line class="grid" x1="80" y1="150.0" x2="720" y2="150.0"/>
<text class="ax" x="72" y="154.0" text-anchor="end">0.36</text>
<line class="grid" x1="80" y1="110.0" x2="720" y2="110.0"/>
<text class="ax" x="72" y="114.0" text-anchor="end">0.38</text>
<line class="grid" x1="80" y1="70.0" x2="720" y2="70.0"/>
<text class="ax" x="72" y="74.0" text-anchor="end">0.40</text>
<line class="grid" x1="178.9" y1="70" x2="178.9" y2="370"/>
<text class="ax" x="178.9" y="388" text-anchor="middle">10 kB</text>
<line class="grid" x1="427.6" y1="70" x2="427.6" y2="370"/>
<text class="ax" x="427.6" y="388" text-anchor="middle">100 kB</text>
<line class="grid" x1="676.2" y1="70" x2="676.2" y2="370"/>
<text class="ax" x="676.2" y="388" text-anchor="middle">1 MB</text>
<text class="ax" x="400.0" y="416" text-anchor="middle">bytes sent per episode (all robots)</text>
<line class="ci2" x1="158.8" y1="317.7" x2="158.8" y2="261.1"/>
<circle class="pt2" cx="158.8" cy="289.6" r="5"/>
<text class="l" x="168.8" y="293.6" text-anchor="start">cross_rank (H2 control)</text>
<line class="ci2" x1="339.8" y1="327.2" x2="339.8" y2="271.1"/>
<circle class="pt2" cx="339.8" cy="299.2" r="5"/>
<text class="l" x="329.8" y="317.2" text-anchor="end">age_revisit</text>
<line class="ci2" x1="352.7" y1="327.6" x2="352.7" y2="271.3"/>
<circle class="pt2" cx="352.7" cy="299.5" r="5"/>
<text class="l" x="362.7" y="291.5" text-anchor="start">no_comm</text>
<line class="ci2" x1="627.5" y1="278.1" x2="627.5" y2="224.2"/>
<circle class="pt2" cx="627.5" cy="251.2" r="5"/>
<text class="l" x="637.5" y="255.2" text-anchor="start">ttl_ids</text>
<line class="ci2" x1="568.1" y1="149.5" x2="568.1" y2="76.8"/>
<circle class="pt2" cx="568.1" cy="113.5" r="5"/>
<text class="l" x="578.1" y="117.5" text-anchor="start">naive_gossip</text>
<line class="ci2" x1="649.0" y1="350.3" x2="649.0" y2="292.3"/>
<circle class="pt2" cx="649.0" cy="321.5" r="5"/>
<text class="l" x="659.0" y="337.5" text-anchor="start">dynamics_ids</text>
<line class="ci" x1="533.9" y1="351.9" x2="533.9" y2="291.1"/>
<circle class="pt" cx="533.9" cy="322.2" r="6.5"/>
<text class="l" x="543.9" y="312.2" text-anchor="start" font-weight="600">repair (candidate)</text>
</svg>
